<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}App{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f4f4f6;
      --surface:  #ffffff;
      --border:   #e2e2e8;
      --accent:   #5b4ef8;
      --accent2:  #3b82f6;
      --text:     #18181c;
      --muted:    #8b8b9a;
      --error:    #dc2626;
      --radius:   14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 0 1px #00000008, 0 8px 32px #0000000f;
      animation: rise .4s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      letter-spacing: .04em;
      color: var(--accent);
      margin-bottom: 32px;
      display: inline-block;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .field { margin-bottom: 18px; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px #5b4ef820;
    }

    .errorlist {
      list-style: none;
      margin-top: 6px;
    }
    .errorlist li {
      font-size: .8rem;
      color: var(--error);
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: var(--accent);
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .15s, transform .15s;
    }

    .btn:hover  { opacity: .88; }
    .btn:active { transform: scale(.98); }

    .link-row {
      margin-top: 22px;
      text-align: center;
      font-size: .85rem;
      color: var(--muted);
    }

    .link-row a {
      color: var(--accent2);
      text-decoration: none;
      font-weight: 500;
    }
    .link-row a:hover { text-decoration: underline; }

    /* messages */
    .messages { list-style: none; margin-bottom: 16px; }
    .messages li {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .875rem;
      margin-bottom: 8px;
    }
    .messages .error   { background: #ff5f5f18; color: var(--error); border: 1px solid #ff5f5f30; }
    .messages .success { background: #c8f04e18; color: var(--accent); border: 1px solid #c8f04e30; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
